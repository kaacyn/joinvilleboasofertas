<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Joinville Boas Ofertas — em breve, as melhores promoções da cidade.">
  <meta name="theme-color" content="#0D131D">
  <title>Joinville Boas Ofertas — Em breve</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLF2L14S0N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BLF2L14S0N');
  </script>

  <style>
    :root {
      --navy: #0D131D;
      --navy-light: #151d2b;
      --yellow: #FFC800;
      --red: #E61E25;
      --white: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.65);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--white);
      background: var(--navy);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 200, 0, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(230, 30, 37, 0.06) 0%, transparent 40%),
        linear-gradient(180deg, var(--navy) 0%, #0a0f17 100%);
    }

    .ring {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .ring--outer {
      width: min(72vw, 340px);
      height: min(72vw, 340px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      border: 3px solid rgba(255, 200, 0, 0.12);
    }

    .ring--inner {
      width: min(62vw, 300px);
      height: min(62vw, 300px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      border: 2px solid rgba(230, 30, 37, 0.15);
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 2.5rem;
      text-align: center;
      gap: 0;
    }

    .logo {
      width: min(180px, 48vw);
      height: auto;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.4));
      animation: fade-up 0.7s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      border: 2px solid var(--yellow);
      background: rgba(255, 200, 0, 0.1);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 1.25rem;
      animation: fade-up 0.7s 0.1s ease both;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(1.6rem, 5.5vw, 2.4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      max-width: 22ch;
      animation: fade-up 0.7s 0.15s ease both;
    }

    h1 .highlight {
      color: var(--yellow);
    }

    .tagline {
      margin-top: 1rem;
      font-size: clamp(0.95rem, 2.8vw, 1.15rem);
      font-weight: 600;
      color: var(--muted);
      max-width: 32ch;
      line-height: 1.55;
      animation: fade-up 0.7s 0.2s ease both;
    }

    .tagline strong {
      color: var(--white);
      font-weight: 700;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 2rem;
      max-width: 420px;
      width: 100%;
      animation: fade-up 0.7s 0.25s ease both;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      background: var(--navy-light);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .feature-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .feature-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--yellow);
      line-height: 1.3;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2rem;
      padding: 0.9rem 1.6rem;
      border-radius: 999px;
      border: none;
      background: var(--red);
      color: var(--white);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(230, 30, 37, 0.35);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      animation: fade-up 0.7s 0.3s ease both;
    }

    .cta:hover {
      background: #c91920;
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(230, 30, 37, 0.45);
    }

    .cta svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: currentColor;
      flex-shrink: 0;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 1.25rem;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255, 200, 0, 0.5);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    @media (min-width: 480px) {
      .features {
        grid-template-columns: repeat(4, 1fr);
      }

      .feature-label {
        font-size: 0.58rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="ring ring--outer" aria-hidden="true"></div>
  <div class="ring ring--inner" aria-hidden="true"></div>

  <main>
    <picture>
      <source srcset="/assets/logo.webp" type="image/webp">
      <img
        class="logo"
        src="/assets/logo.png"
        alt="Joinville Boas Ofertas — as melhores ofertas perto de você"
        width="180"
        height="180"
        decoding="async"
        fetchpriority="high"
      >
    </picture>

    <div class="badge">
      <span class="badge-dot" aria-hidden="true"></span>
      Em breve
    </div>

    <h1>Em breve, <span class="highlight">novidades!</span></h1>

    <p class="tagline">
      Estamos preparando <strong>as melhores ofertas perto de você</strong> —
      supermercados, promoções e economia todo dia em Joinville e região.
    </p>

    <div class="features" aria-label="Diferenciais">
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">🏷️</span>
        <span class="feature-label">Ofertas atualizadas</span>
      </div>
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">🛒</span>
        <span class="feature-label">Supermercados da cidade</span>
      </div>
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">❤️</span>
        <span class="feature-label">Economize todo dia</span>
      </div>
      <div class="feature">
        <span class="feature-icon" aria-hidden="true">📍</span>
        <span class="feature-label">Joinville e região</span>
      </div>
    </div>

    <a
      class="cta"
      href="https://www.instagram.com/joinvilleboasofertas/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
      Siga no Instagram
    </a>
  </main>

  <footer>
    &copy; <span id="year"></span> Joinville Boas Ofertas
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
