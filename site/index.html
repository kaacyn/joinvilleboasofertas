<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Joinville Boas Ofertas — em breve, as melhores promoções da cidade.">
  <meta name="theme-color" content="#0b3d2e">
  <title>Joinville Boas Ofertas — Em breve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #071f18;
      --bg-mid: #0b3d2e;
      --accent: #3ee08f;
      --accent-warm: #f5c842;
      --text: #e8f5ef;
      --text-muted: #8fb9a8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(62, 224, 143, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 80%, rgba(245, 200, 66, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 45%, #062a1f 100%);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(62, 224, 143, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 224, 143, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 20%, transparent 75%);
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border: 1px solid rgba(62, 224, 143, 0.35);
      border-radius: 999px;
      background: rgba(62, 224, 143, 0.08);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      animation: fade-up 0.8s ease both;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-family: "Syne", sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 14ch;
      animation: fade-up 0.8s 0.1s ease both;
    }

    h1 span {
      display: block;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-warm) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 1.25rem;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      color: var(--text-muted);
      max-width: 28ch;
      line-height: 1.5;
      animation: fade-up 0.8s 0.2s ease both;
    }

    .divider {
      width: 3rem;
      height: 3px;
      margin: 2.5rem auto;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: fade-up 0.8s 0.3s ease both;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      border: 1px solid rgba(232, 245, 239, 0.15);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
      animation: fade-up 0.8s 0.4s ease both;
    }

    .instagram:hover {
      border-color: rgba(62, 224, 143, 0.5);
      background: rgba(62, 224, 143, 0.1);
      transform: translateY(-2px);
    }

    .instagram svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(143, 185, 168, 0.6);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>

  <main>
    <div class="badge">
      <span class="badge-dot" aria-hidden="true"></span>
      Em construção
    </div>

    <h1>
      Joinville
      <span>Boas Ofertas</span>
    </h1>

    <p class="tagline">Em breve, novidades! Estamos preparando as melhores promoções da cidade para você.</p>

    <div class="divider" aria-hidden="true"></div>

    <a class="instagram" href="https://www.instagram.com/joinvilleboasofertas/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
      @joinvilleboasofertas
    </a>
  </main>

  <footer>
    &copy; <span id="year"></span> Joinville Boas Ofertas
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
