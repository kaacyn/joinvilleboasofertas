services:
  web:
    build: .
    container_name: ${CONTAINER_NAME:-jbo-web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - snap-net

networks:
  snap-net:
    external: true
