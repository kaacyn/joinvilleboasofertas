services:
  app:
    build:
      context: .
      args:
        NUXT_API_BASE: ${NUXT_API_BASE:-http://snap-api-dev:8000}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://joinvilleboasofertas-loc-app.cacin.dev}
    container_name: ${APP_CONTAINER_NAME:-jbo-dev-nuxt}
    restart: unless-stopped
    environment:
      NUXT_API_BASE: ${NUXT_API_BASE:-http://snap-api-dev:8000}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://joinvilleboasofertas-loc-app.cacin.dev}
    networks:
      - snap-net

  proxy:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_NAME:-jbo-web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - snap-net

networks:
  snap-net:
    external: true
