services:
  web:
    build: .
    container_name: joinvilleboasofertas-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - snap-net

  # Expõe o site publicamente via Cloudflare Tunnel (domínio joinvilleboasofertas.com).
  # Token em .env (CF_TUNNEL_TOKEN) — mesma origem que ACESSOS.MD.
  # No painel Cloudflare, rota: joinvilleboasofertas.com → http://joinvilleboasofertas-web:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    profiles: ["tunnel"]
    networks:
      - default
      - snap-net

networks:
  snap-net:
    external: true
